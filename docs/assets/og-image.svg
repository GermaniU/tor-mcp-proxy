<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14112a"/>
      <stop offset="1" stop-color="#1b1733"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#7d4698" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7d4698" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b57edc"/>
      <stop offset="1" stop-color="#f0a6ca"/>
    </linearGradient>
    <pattern id="grid" width="100" height="120" patternUnits="userSpaceOnUse">
      <path d="M100 0V120M0 120H100" stroke="#ffffff" stroke-opacity="0.035" fill="none"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- onion mark -->
  <g transform="translate(935 205)" fill="none" stroke-width="7">
    <circle r="120" stroke="#7d4698" stroke-opacity="0.55"/>
    <circle r="88" stroke="#9b5fc0" stroke-opacity="0.7"/>
    <circle r="56" stroke="#b57edc" stroke-opacity="0.85"/>
    <circle r="24" fill="#f0a6ca" stroke="none"/>
  </g>

  <g font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif">
    <rect x="80" y="78" width="14" height="14" rx="3" fill="url(#title)"/>
    <text x="108" y="92" font-size="19" letter-spacing="2" fill="#a9a3c4">OPEN SOURCE · MIT · MCP SERVER</text>

    <text x="76" y="222" font-size="112" font-weight="800" fill="#ffffff">Tor MCP</text>
    <text x="76" y="338" font-size="112" font-weight="800" fill="url(#title)">Proxy</text>

    <text x="80" y="398" font-size="27" font-weight="600" fill="#e8e4f5">Navega la web por Tor desde tu agente IA.</text>
    <text x="80" y="436" font-size="20" fill="#a9a3c4">Un circuito por llamada · .onion · sin fugas de DNS · Node.js.</text>

    <g font-size="17" fill="#e8e4f5">
      <rect x="80" y="470" width="122" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="141" y="495" text-anchor="middle">Claude Code</text>
      <rect x="212" y="470" width="96" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="260" y="495" text-anchor="middle">Cursor</text>
      <rect x="318" y="470" width="120" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="378" y="495" text-anchor="middle">OpenCode</text>
      <rect x="448" y="470" width="92" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="494" y="495" text-anchor="middle" fill="#f0a6ca">.onion</text>
      <rect x="550" y="470" width="82" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="591" y="495" text-anchor="middle" fill="#b57edc">+ MCP</text>
    </g>

    <line x1="80" y1="560" x2="1120" y2="560" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="80" y="595" font-family="'JetBrains Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="20" fill="#a9a3c4">github.com/GermaniU/tor-mcp-proxy</text>
    <text x="1120" y="595" text-anchor="end" font-size="20" font-weight="600" fill="#b57edc">@GermaniU</text>
  </g>
</svg>
